name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build release package
        run: python build_release.py

      - name: Read release name
        shell: pwsh
        run: |
          $content = Get-Content -Raw -Encoding UTF8 "帆布订单整理.py"
          $appName = [regex]::Match($content, '(?m)^APP_NAME\s*=\s*"([^"]+)"').Groups[1].Value
          $appVersion = [regex]::Match($content, '(?m)^APP_VERSION\s*=\s*"([^"]+)"').Groups[1].Value
          "RELEASE_NAME=${appName}_${appVersion}" >> $env:GITHUB_ENV

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}
          path: release/*.zip
